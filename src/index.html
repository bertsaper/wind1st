<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Wind1st</title>
    <style>
        /* Styling for the loading screen */
        #loading-screen {
            position: fixed;
            width: 100%;
            height: 100%;
            background-color: #000;
            /* Background color for loading screen */
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
        }

        #loading-logo {
            width: 150px;
            /* Adjust the size of your logo */
            height: auto;
        }
    </style>
    <!-- add to homescreen for ios -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black" />
</head>

<body>
    <div id="loading-screen">
        <img id="loading-logo" src="./assets/wind1st.gif" alt="Loading..."> <!-- Path to your logo image -->
    </div>

    <app-root></app-root> <!-- Angular app root -->
    <script>
        // Hide the loading screen once the app has initialized
        window.addEventListener('load', () => {
            const loadingScreen = document.getElementById('loading-screen');
            if (loadingScreen) {
                loadingScreen.style.display = 'none';
            }
        });
    </script>

</body>

</html>
